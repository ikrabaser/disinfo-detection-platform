name: CD - Publish Containers

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-container-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write


jobs:
  backend-image:
    name: Publish backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true

          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


  frontend-image:
    name: Publish frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true

          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  summary:
    name: Delivery summary
    runs-on: ubuntu-latest

    needs:
      - backend-image
      - frontend-image

    steps:
      - name: Write delivery summary
        run: |
          echo "## VERITAS Container Delivery" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published from commit:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}-backend:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}-frontend:latest\`" >> "$GITHUB_STEP_SUMMARY"
