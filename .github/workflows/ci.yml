name: CI

on:
  push:
    branches:
      - ikra
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: dezenformasyon_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dezenformasyon_db
      REDIS_URL: redis://localhost:6379/0

      JWT_COOKIE_SECURE: "false"

      CORS_ALLOWED_ORIGINS: http://localhost:5174

      CENTRIFUGO_API_URL: http://localhost:8002/api
      CENTRIFUGO_API_KEY: ci-centrifugo-key
      CENTRIFUGO_HMAC_SECRET: ci-centrifugo-secret

      PROCRASTINATE_ENABLED: "true"

      NLP_MODEL_PATH: /tmp/veritas-no-local-model

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install -r requirements-ml.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: pytest -q


  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build


  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose config


  summary:
    name: CI summary
    runs-on: ubuntu-latest
    if: always()

    needs:
      - backend
      - frontend
      - compose

    steps:
      - name: Write summary
        run: |
          echo "## VERITAS CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend | ${{ needs.backend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | ${{ needs.frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Compose | ${{ needs.compose.result }} |" >> "$GITHUB_STEP_SUMMARY"
