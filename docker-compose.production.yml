services:
  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dezenformasyon_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  centrifugo:
    image: centrifugo/centrifugo:v5

    command:
      - centrifugo
      - -c
      - /centrifugo/config.json

    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_SECRET}

    volumes:
      - ./infra/centrifugo/config.production.json:/centrifugo/config.json:ro

    depends_on:
      redis:
        condition: service_healthy


  backend:
    image: ghcr.io/ikrabaser/disinfo-detection-platform-backend:latest

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dezenformasyon_db}
      REDIS_URL: redis://redis:6379/0

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}

      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET}

      MODEL_BUNDLE_URL: https://github.com/ikrabaser/disinfo-detection-platform/releases/download/models-v1/veritas-models-v1.tar.gz
      MODEL_BUNDLE_SHA256: a96e8b35c61721c97b21430b47947dbfac1060f2582062845df9dd4f66cae879
      MODEL_ARTIFACTS_REQUIRED: "true"

      PROCRASTINATE_ENABLED: "true"

      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      centrifugo:
        condition: service_started

    volumes:
      - model_artifacts:/app/ml_models
      - static_files:/app/staticfiles

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/api/health/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s


  worker:
    image: ghcr.io/ikrabaser/disinfo-detection-platform-backend:latest

    entrypoint:
      - /bin/sh
      - -c
      - |
        python scripts/provision_model_artifacts.py
        exec python manage.py procrastinate worker

    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dezenformasyon_db}
      REDIS_URL: redis://redis:6379/0

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET}

      MODEL_BUNDLE_URL: https://github.com/ikrabaser/disinfo-detection-platform/releases/download/models-v1/veritas-models-v1.tar.gz
      MODEL_BUNDLE_SHA256: a96e8b35c61721c97b21430b47947dbfac1060f2582062845df9dd4f66cae879
      MODEL_ARTIFACTS_REQUIRED: "true"

      PROCRASTINATE_ENABLED: "true"

      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    depends_on:
      backend:
        condition: service_healthy

      centrifugo:
        condition: service_started

    volumes:
      - model_artifacts:/app/ml_models


  frontend:
    image: ghcr.io/ikrabaser/disinfo-detection-platform-frontend:latest

    depends_on:
      backend:
        condition: service_healthy


  nginx:
    image: nginx:1.27-alpine

    ports:
      - "${HTTP_PORT:-8080}:80"

    volumes:
      - ./infra/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/static:ro

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_started

      centrifugo:
        condition: service_started


volumes:
  postgres_data:
  model_artifacts:
  static_files:
