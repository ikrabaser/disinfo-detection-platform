# Reverse-proxy nginx yapilandirmasi (iskelet).
#
# docker-compose.yml icindeki `nginx` servisi bu dosyayi kullanir ve
# frontend (statik dosyalar) ile backend (Django/DRF API) arasinda tek bir
# giris noktasi (80. port) saglar.
#
# TODO: production'da SSL/TLS terminasyonu (443, certbot/letsencrypt) ve
# gzip/caching ayarlari eklenmelidir.

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
    }
}
